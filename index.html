 <!DOCTYPE html>
 <html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
content="width=device-width,
initial-scale=1.0" />
   <title>Patient Health Dashboard</title>
   <link rel="stylesheet"href="https://cdn
   .jsdelivr.net/npm/bootstrap@5.3.0/dist
   /css/bootstrap.min.css"/>
   <style>
    body{
        font-size: 16px;
        background-color:#f7f9fb;
        color:#222;
        transition:'background' 0.3s,color 0.3s;
    }
    [data-theme="dark"] {
        background-color:#121212;
        color:#fff;
    }
    header {
        background-color:#0077b6;
        color:white;
        padding:1rem;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    button, select {
        font-size: 16px;
    }
    .card {
        border-radius: 10px;
        margin:1rem 0;  
        padding:1rem;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .icon {
        font-size:2rem;
        vertical-align:middle;
    }
    .voice-controls button {
        margin-right:0.5rem;
    }
    </style>
    </head>
    <body>
        <header>
            <div>
                <h1 class="h4 mb-0">My Health Dashboard</h1>
                </div>
                <div>
                   <label for="language" class="me-2">Language:</label>
                   <select id="language" aria-label="Language selector" class="form-select d-inline-block w-auto">
                    <option value="en">English</option>
                    <option value="es">Espanol</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="te">Telugu</option>
                    <option value="ta">Tamil</option>
                    <option value="ma">Malayalam</option>
                </select>
                <button id="themeToggle" class="btn btn-outline-light ms-2" aria-label="Toggle dark or light mode">🌓</button>
            </div>
            </header>

            <main class="container my-3">
                <section class="card" aria-labelledby="labResult">
                    <h2 id="labResult" class="h5 mb-3">My Lab Result</h2>
                    <canvas id="labChart" aria-label="Lab Chart of patient values"></canvas>
                    <p class="mt-3">Colored bars represent current lab values compared to normal reference ranges</p>
                      <button id="askDoctor" class="btn btn-primary" aria-label="Ask my doctor about this result">Ask My Doctor</button>
                </section>

                <section class="card">
                    <h2 class="h5 mb-2">Understanding Results</h2>
                    <div class="d-flex align-items-center">
                        <span class="icon">🩸</span>
                        <p id="explanation" class="ms-3">Your cholosterol level is high. This means too much fat in your blood.Try eating foods rich in fiber and limiting fried foods.</p>
                        </div>
                        <div class="voice-controls mt-3">
                         <button id="playVoice" class="btn btn-success"aria-label="Play voice explanation">▶play</button>
                         <button id="pauseVoice" class="btn btn-danger"aria-label="Pause voice">⏸Pause</button>
                         </div>
                         </section>
                                  
                        <section class="card">
                            <h2 class="h5">Caregiver Acess & Alert</h2>
                            <label class="form-check">
                                <input type="checkbox" id="caregiverShare"
                        class="form-check-input" aria-label="Share report with caregiver">
                        <span class="form-check-label">Share simplified summary with my caregiver</span>
                            </label>
                            <button class="btn btn-Warning mt-2" aria-label="Notification center"🔔Notification</button>
                            </section>
                            </main>

                            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                            <script>
                            //Dark Mode Toggle
                            const themeToggle=document.getElementById('themeToggle');
                            themeToggle.addEventListenter('click',()=> {
                                document.body.dataset.theme = document.body.dataset.theme ==='dark'?":"'dark';
                            });

                            //Lab Data Chart
                            const ctx = document.getElementById('labChart');
                            new Chart(ctx,{
                                type: 'bar',
                                data:{
                                    labels:['Glucose','Cholesterol','Blood Pressure'],
                                    datasets:[{
                                    label:'Your Values',
                                    data: [85,220,130],
                                    backgroundColor: ['green','orange','red']
                                    }, {
                                        label:'Normal Range Upper',
                                        data: [100,200,120],
                                        backgroundColor: 'rgba(0,0,0,0.1)'
                                    }]
                                },
                                options:{
                                    plugins:{
                                        tooltip:{
                                            callbac:{
                                            }
                                        }
                                    }
                                }
                            })
